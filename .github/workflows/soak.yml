name: Soak

# The `*_fuzz_never_panics` loops and the `*_invariants_hold` property tests,
# run many times longer than every push runs them and from a new seed each
# night (see `src-tauri/src/fuzz.rs`). A loop prints the seed it used, so a
# failure found here can be run again locally with the same `EMBER_FUZZ_SEED`
# and `EMBER_FUZZ_SCALE`.
#
# Action pins and toolchain mirror ci.yml.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: "How many times longer than CI each loop runs"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Long fuzz loops
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            file

      # Optimized: the loops verify signatures and seal envelopes, and at this
      # length a debug build spends the job's time on that rather than on inputs.
      - name: Run the fuzz loops
        env:
          EMBER_FUZZ_SCALE: ${{ github.event.inputs.scale || '200' }}
          EMBER_FUZZ_SEED: ${{ github.run_id }}
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib fuzz_never_panics -- --nocapture

      - name: Run the property tests
        env:
          EMBER_FUZZ_SCALE: ${{ github.event.inputs.scale || '200' }}
          EMBER_FUZZ_SEED: ${{ github.run_id }}
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib invariants_hold -- --nocapture
