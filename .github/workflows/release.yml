name: Release

# Cuts a signed DRAFT release when an exact version tag is pushed. The flow is:
#   1. Bump the version (`npm run bump-version -- X.Y.Z`).
#   2. Commit, then `git tag vX.Y.Z && git push --tags`.
#   3. This workflow verifies policy in a no-secret job, validates the build in
#      a second no-secret job, then enters the protected release-signing
#      environment to build/sign and create a DRAFT GitHub Release.
#   4. Review the draft, add notes, and Publish. Publishing is what makes
#      `releases/latest/download/latest.json` resolve, so installed apps only
#      see the update once you've deliberately published.
#
# Required secrets on the protected `release-signing` environment:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ember-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password set during key generation
# (GITHUB_TOKEN is provided automatically.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify tag, versions, and workflow policy
        run: node scripts/verify-release-policy.mjs --require-tag

      - name: Run release policy tests
        run: node --test scripts/*.test.mjs

  build:
    name: Validate Windows build
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test hardened updater
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml commands::updater::tests

  sign-publish:
    name: Sign and create draft release
    needs: [verify, build]
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # This gate deliberately runs before any step references an environment
      # secret. A bad tag/version/policy never reaches signing or publication.
      - name: Re-verify release policy before secrets
        run: node scripts/verify-release-policy.mjs --require-tag

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign updater artifacts, and create draft
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ember ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Add signed security metadata to latest.json
        id: manifest
        env:
          EMBER_UPDATE_SECURITY_EPOCH: "1"
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/harden-update-manifest.mjs

      - name: Sign hardened latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- signer sign "${{ steps.manifest.outputs.manifest }}"

      - name: Replace draft manifest and upload its signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" "${{ steps.manifest.outputs.manifest }}" "${{ steps.manifest.outputs.manifest }}.sig" --clobber
