name: Release

# Cuts a signed DRAFT release when an exact version tag is pushed. The flow is:
#   1. Bump the version (`npm run bump-version -- X.Y.Z`) and write that
#      version's section in docs/index.html — the release body and the updater's
#      notes are both rendered from it, and a missing section fails the build.
#   2. Commit, then `git tag vX.Y.Z && git push --tags`.
#   3. This workflow verifies policy in a no-secret job, validates and builds
#      the Windows and Linux packages in no-secret jobs, then enters the
#      protected release-signing environment only to sign those packages and
#      create a DRAFT GitHub Release.
#   4. Review the draft and Publish. Publishing is what makes
#      `releases/latest/download/latest.json` resolve, so installed apps only
#      see the update once you've deliberately published. Editing the draft body
#      afterwards does not change the notes already signed into latest.json.
#
# Required secrets on the protected `release-signing` environment:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ember-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password set during key generation
# (GITHUB_TOKEN is provided automatically.)
#
# Nothing is compiled while the signing key exists. `build-windows` and
# `build-linux` are ordinary no-secret jobs: they produce the installers with
# `createUpdaterArtifacts` off and hand them over as workflow artifacts. A key
# present during a build is within reach of every npm install script, Vite
# plugin, build.rs and proc-macro in the dependency tree. `sign-publish`
# executes nothing from the dependency tree besides the lockfile-pinned Tauri
# CLI (installed with install scripts off), signs the downloaded bundles with
# `tauri signer sign`, and publishes — so the key only ever exists inside that
# one job, and never alongside a compiler.
#
# `createUpdaterArtifacts: true` signs the installers themselves rather than
# archives of them, so signing them afterwards yields the same `.sig` files the
# bundler would have written. `scripts/compose-update-manifest.mjs` writes the
# Windows half of latest.json that tauri-action used to.
#
# Both Linux formats self-update. `tauri-plugin-updater` chooses its artifact
# from a marker the bundler writes into each package it builds, so a `.deb`
# install resolves `linux-x86_64-deb` and installs it with `dpkg -i`, while an
# AppImage resolves `linux-x86_64-appimage` and rewrites itself in place.
# `scripts/add-linux-platforms.mjs` composes both entries, and says there why no
# bare `linux-x86_64` key is published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Ember DHT check compares against the previous release tag. The
          # default shallow checkout has no older tag, and the script refuses
          # to run a release check on one rather than skip it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify tag, versions, and workflow policy
        run: node scripts/verify-release-policy.mjs --require-tag

      - name: Run release policy tests
        run: node --test scripts/*.test.mjs

  build:
    name: Validate Windows build
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test hardened updater
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml commands::updater::tests

  build-windows:
    name: Build Windows installers
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Same override as `build-linux`, for the same reason: this job holds no
      # signing key. bash rather than pwsh because pwsh hands `npm.cmd` the JSON
      # with its inner quotes stripped.
      - name: Build installers
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis,msi \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ember-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux packages
    needs: verify
    runs-on: ubuntu-22.04
    # The glibc baseline (2.35) Tauri recommends for shipping, and the same
    # runner `check-linux` compiles on. An AppImage bundles everything except
    # glibc and glibc is only forwards compatible, so the distro this is built
    # on is the oldest one the result can run on.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # `xdg-utils` and `desktop-file-utils` are not in `check-linux`'s list
      # because that job only compiles. The AppImage bundler shells out to
      # `xdg-mime` for the `.emulecollection` file association and fails at the
      # very last step without it.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            file \
            xdg-utils \
            desktop-file-utils

      - name: Install frontend dependencies
        run: npm ci

      # `createUpdaterArtifacts` is forced off because this job holds no signing
      # key: tauri.conf.json enables it for the release, and the bundler would
      # fail at the updater step after paying for a full compile. The bundles
      # themselves still carry the marker that tells the updater which format
      # each one is, so signing them in `sign-publish` loses nothing.
      #
      # `APPIMAGE_EXTRACT_AND_RUN` is set because the bundler runs linuxdeploy,
      # which is itself an AppImage and therefore wants FUSE the runner has not
      # got.
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npm run tauri build -- --bundles appimage,deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ember-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  sign-publish:
    name: Sign and create draft release
    needs: [verify, build, build-windows, build-linux]
    # Nothing is built here, so the runner OS is free; bash keeps the argument
    # handling for `gh` and the CLI predictable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # Under `src-tauri/target` because that is the tree the hardening step
      # walks: it resolves every platform entry in latest.json to a local file
      # so it can hash it, and it can only hash what is on this runner. Named
      # once because the download, the signing pass, the upload, and the
      # scripts that read the signatures back all have to agree.
      EMBER_WINDOWS_BUNDLE_DIR: src-tauri/target/windows-bundles
      EMBER_LINUX_BUNDLE_DIR: src-tauri/target/linux-bundles
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # As in `verify`: the policy gate below reads the previous release tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # This gate deliberately runs before any step references an environment
      # secret. A bad tag/version/policy never reaches signing or publication.
      - name: Re-verify release policy before secrets
        run: node scripts/verify-release-policy.mjs --require-tag

      # The notes become two things: the draft release body, and the `notes`
      # field baked into latest.json before it is hardened and signed. Editing
      # the draft afterwards cannot fix the manifest, so the notes have to be
      # right here. Fails the release if the version has no section in
      # docs/index.html.
      - name: Render release notes from the changelog
        id: release_notes
        run: node scripts/release-notes.mjs

      # Only for the Tauri CLI, the one package this job executes. The lockfile
      # pins it and its native binary by integrity, and `--ignore-scripts`
      # keeps every package's install hooks from running beside the key.
      - name: Install the pinned Tauri CLI without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the Windows installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ember-windows-x86_64
          path: ${{ env.EMBER_WINDOWS_BUNDLE_DIR }}

      - name: Download the Linux packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ember-linux-x86_64
          path: ${{ env.EMBER_LINUX_BUNDLE_DIR }}

      # `signer sign` writes `<file>.sig` beside each bundle, which is both what
      # the manifest carries and what the plugin verifies the downloaded bytes
      # against before installing. `npx --no-install` runs the CLI from
      # node_modules and never fetches one.
      - name: Sign the installers and packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mapfile -d '' bundles < <(find "$EMBER_WINDOWS_BUNDLE_DIR" "$EMBER_LINUX_BUNDLE_DIR" \
            -type f ! -name '*.sig' -print0)
          if [ "${#bundles[@]}" -lt 4 ]; then
            echo "expected the NSIS, MSI, AppImage and .deb bundles, found ${#bundles[@]}" >&2
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            npx --no-install tauri signer sign "$bundle" \
              || { echo "failed to sign $bundle" >&2; exit 1; }
          done

      # A re-run finds the draft the previous attempt created and reuses it; a
      # release that has already been published is never touched.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMBER_RELEASE_NOTES: ${{ steps.release_notes.outputs.body }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$EMBER_RELEASE_NOTES" > "$notes"
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published; refusing to modify it" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "Ember $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Ember $GITHUB_REF_NAME" --notes-file "$notes"
          fi

      - name: Attach the installers and packages to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find "$EMBER_WINDOWS_BUNDLE_DIR" "$EMBER_LINUX_BUNDLE_DIR" \
            -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      # After the upload, so the manifest can never name an asset that is not
      # on the release, and before hardening, so every entry is hashed and
      # size-bound by the same pass.
      - name: Compose latest.json from the signed Windows installers
        env:
          EMBER_RELEASE_NOTES: ${{ steps.release_notes.outputs.body }}
        run: node scripts/compose-update-manifest.mjs

      - name: Add the Linux targets to latest.json
        run: node scripts/add-linux-platforms.mjs

      - name: Add signed security metadata to latest.json
        id: manifest
        env:
          EMBER_UPDATE_SECURITY_EPOCH: "1"
        run: node scripts/harden-update-manifest.mjs

      - name: Sign hardened latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: npx --no-install tauri signer sign "$MANIFEST"

      - name: Replace draft manifest and upload its signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: gh release upload "$GITHUB_REF_NAME" "$MANIFEST" "$MANIFEST.sig" --clobber
