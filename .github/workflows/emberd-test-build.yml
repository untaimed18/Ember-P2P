name: emberd test build

# Builds emberd, Ember without a window, on demand: the x86-64 tarball and
# `.deb` to hand to a tester, packaged by the script release.yml uses, and the
# Docker image from source, built to prove the Dockerfile still works. Nothing
# is published; release.yml and emberd-image.yml do that for a release.
#
# Built on Ubuntu 22.04 for the same reason the desktop `.deb` is: glibc is
# only forwards compatible, and 2.35 runs on every distro still supported.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberd-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarball:
    name: Linux x86_64 tarball and .deb
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: emberd-release

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the web interface
        run: npm run build:web

      - name: Build emberd
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --no-default-features --features server --bin emberd

      - name: Package the tarball and the .deb
        run: |
          version=$(node -p "require('./package.json').version")
          bash packaging/emberd/package.sh "$version" out
          bash packaging/emberd/check-packages.sh "$version" out

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emberd-linux-x86_64
          path: |
            out/*.tar.gz
            out/*.deb
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f packaging/emberd/Dockerfile -t emberd:test .

      # `--version` only: a running emberd joins the P2P network, which a CI
      # runner has no business doing.
      - name: Run it
        run: docker run --rm emberd:test --version
