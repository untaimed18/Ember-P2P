name: emberd test build

# Builds emberd, Ember without a window, on demand: a Linux tarball to hand to
# a tester, and the Docker image, built to prove the Dockerfile still works.
# Nothing is signed or published; release.yml stays the only thing that
# publishes, and emberd joins it once its web interface has shipped.
#
# The tarball is built on Ubuntu 22.04 for the same reason the desktop `.deb`
# is: glibc is only forwards compatible, and 2.35 runs on every distro still
# supported. Unpacked, it is the /opt/emberd that packaging/emberd/emberd.service
# expects.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberd-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarball:
    name: Linux x86_64 tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: emberd-release

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the web interface
        run: npm run build:web

      - name: Build emberd
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --no-default-features --features server --bin emberd

      - name: Assemble the tarball
        run: |
          version=$(node -p "require('./package.json').version")
          name="emberd-${version}-linux-x86_64"
          mkdir -p "out/${name}/resources"
          cp src-tauri/target/release/emberd "out/${name}/"
          cp -r build-web "out/${name}/web"
          cp src-tauri/resources/dbip-country-lite.mmdb "out/${name}/resources/"
          cp packaging/emberd/emberd.toml packaging/emberd/emberd.service "out/${name}/"
          cp LICENSE "out/${name}/"
          "out/${name}/emberd" --version
          tar -C out -czf "out/${name}.tar.gz" "${name}"
          echo "TARBALL=out/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emberd-linux-x86_64
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f packaging/emberd/Dockerfile -t emberd:test .

      # `--version` only: a running emberd joins the P2P network, which a CI
      # runner has no business doing.
      - name: Run it
        run: docker run --rm emberd:test --version
