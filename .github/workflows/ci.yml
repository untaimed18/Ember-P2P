name: CI

# Runs the release pipeline's own gates on every pull request and every push to
# main. Before this existed the checks below ran only after a `v*` tag, so a
# failure (three untranslated backend error codes, in the case that prompted
# this file) reached the default branch and then aborted the release instead of
# the pull request that introduced it.
#
# Toolchain versions, action pins and caching deliberately mirror release.yml.
# A gate that drifts from the release environment stops being evidence that the
# release will build.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify policy, locales, and error codes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `verifyVersionAdvanced` compares the declared version against the
          # newest `v*.*.*` tag via `git tag --list`. The default shallow
          # checkout fetches no tags, so the comparison would silently find
          # nothing to compare against and pass.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Not `--require-tag`: that flag means "a release is being cut", which
      # skips the version-ahead comparison because the version must equal the
      # tag. Off a tag, this is the check that keeps `main` from sitting on an
      # already-released version — the one gap the test suite cannot cover,
      # since the tests pass `requireTag: true` themselves.
      - name: Verify release policy
        run: node scripts/verify-release-policy.mjs

      - name: Run release policy, locale, and error-code tests
        run: node --test scripts/*.test.mjs

  check:
    name: Check frontend and desktop Rust
    runs-on: windows-latest
    # Three near-full compile passes (check, clippy --all-targets, test --lib)
    # over ~690 crates and ~180k lines of Rust on a Windows runner. The first
    # run is always cold, because rust-cache keys include the workflow name and
    # so cannot reuse release.yml's cache.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # Clippy runs at its default lint levels: the correctness group is
      # deny-by-default, so this still fails a genuine bug, while the warning
      # backlog nobody has measured yet cannot block a merge. Tighten it to
      # `-- -D warnings` once that backlog is at zero.
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  check-linux:
    name: Check desktop Rust on Linux
    runs-on: ubuntu-22.04
    # Same compile/clippy/lib-test gates as `check`, on the glibc baseline
    # Tauri recommends for shipping `.deb` / AppImage (Ubuntu 22.04). This is
    # not a Linux release job: it does not sign, bundle, or publish. It exists
    # so Linux-only filesystem paths and unix tests cannot rot behind the
    # Windows-only desktop CI.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            file

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  server:
    name: Check rendezvous server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rendezvous-server

      # `--locked` matches what the Dockerfile now builds with, so lockfile
      # drift fails here instead of shipping unpinned transitive crates to an
      # internet-facing service.
      - name: Check Rust
        run: cargo check --locked --manifest-path rendezvous-server/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path rendezvous-server/Cargo.toml --all-targets

      - name: Test Rust
        run: cargo test --locked --manifest-path rendezvous-server/Cargo.toml
