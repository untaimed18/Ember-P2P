[package]
name = "ember"
version = "1.8.1"
description = "A decentralized P2P file sharing application"
authors = ["untaimed18"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "ember"
# `str::floor_char_boundary` (used in the ed2k collection parser and the
# comment store) was stabilized in Rust 1.91. The floor is 1.94, where it was
# set for `rusqlite` 0.40's `libsqlite3-sys`; nothing has been built on an
# older toolchain since.
rust-version = "1.94"

[workspace]
members = ["macros"]

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ember"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "emberd"
path = "src/bin/emberd.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["desktop"]
# The desktop app: Tauri's window, tray, dialogs, notifications and updater.
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-updater",
    "dep:auto-launch",
    "dep:arboard",
    "dep:opener",
    "dep:rfd",
    "dep:zbus",
]
# emberd: the same Ember with no window, driven over HTTP (docs/headless.md).
# Built with `--no-default-features --features server`.
server = [
    "dep:axum",
    "dep:hyper",
    "dep:tower",
    "dep:tower-http",
    "dep:toml",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:subtle",
    "hyper-util/http1",
    "hyper-util/server",
    "hyper-util/server-auto",
    "hyper-util/service",
    "hyper-util/tokio",
    "dep:libdbus-sys",
]
# Local multi-node harness build. Enables Tauri's runtime devtools so the
# webview console (Ctrl+Shift+I) is available in a build that would not
# otherwise have it.
#
# It does not control which commands exist. `ember_ping_peer` and friends are
# gated on `debug_assertions`, so a harness build has to be a debug build to
# reach them — `--features harness` on a release build gets devtools and
# nothing to invoke from them. Gating them on this feature instead was
# considered and rejected: a release build that carries peer-dialing IPC is
# exactly what the gate is for, and a feature flag is too easy to turn on.
harness = ["desktop", "tauri/devtools"]

[dependencies]
ember-macros = { path = "macros" }
# emberd's web interface, `server` feature only: the HTTP and WebSocket
# routes, the files of the web UI, its config file and its TLS.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["fs"], optional = true }
toml = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
subtle = { version = "2", optional = true }
# `tray-icon` enables the `tauri::tray` and `tauri::menu` APIs we use to
# render the "Ember is still running in the system tray" icon when the
# user closes the window with the close-to-tray behavior selected.
tauri = { version = "2", features = ["tray-icon"], optional = true }

tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
rusqlite = { version = "0.43", features = ["bundled"] }
blake3 = "1"
# NFKC for Ember DHT keyword keys and for search spam-filter name matching.
# The copy `url`/`idna` already link; only `compiled_data` is enabled, which is
# the feature set they lock.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
md4 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
digest = "0.10"
byteorder = "1"
rand = "0.8"
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.13", features = ["rustls", "stream", "json"], default-features = false }
# The updater alone follows the system proxy; every other client stays direct.
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
http = "1"
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2.5"
semver = "1"
url = "2"
igd-next = { version = "0.17", features = ["aio_tokio"] }
socket2 = "0.6"
tracing-appender = "0.2"
tauri-plugin-single-instance = { version = "2", optional = true }
# Registers the `ed2k://` URI scheme with the OS so browser/forum links
# launch (or focus) Ember. Combined with single-instance, a link clicked
# while Ember is already running is delivered to the existing instance as
# a command-line argument rather than spawning a second copy.
tauri-plugin-deep-link = { version = "2", optional = true }

tauri-plugin-process = { version = "2", optional = true }
# Desktop notifications for the events that happen while nobody is looking at
# the window: a download finishing, a friend coming online, a chat message.
# Only ever reached through our own `show_notification` command — the plugin's
# JS API is not exposed to the webview, so the text is composed (and localized)
# in the frontend and the OS call is made here.
tauri-plugin-notification = { version = "2", optional = true }
# Launch at sign-in, driven by the `launch_at_login` setting. Used directly
# rather than through `tauri-plugin-autostart`; see `login_launch.rs`.
auto-launch = { version = "0.6", optional = true }
# Clipboard access for the copy/paste affordances (eD2K links, Ember IDs,
# channel invites). The webview's own `navigator.clipboard` is not a
# substitute — WebKitGTK, the Linux webview, refuses programmatic reads
# outright, which is what made pasting an eD2K link impossible there.
#
# `arboard` directly rather than `tauri-plugin-clipboard-manager`, which is a
# thin wrapper over this same crate: the plugin's JS API would not be exposed
# to the webview anyway (the renderer goes through our own
# `read_clipboard_text` / `write_clipboard_text` so the text crossing the
# boundary can be bounded), so it would only add a renderer-reachable command
# surface this app deliberately keeps minimal. Calling it ourselves also lets
# the blocking clipboard round-trip run on `spawn_blocking` instead of on a
# command's async task.
#
# Features are the default set minus `image-data`, which pulls in `image` plus
# PNG/BMP decoders for a clipboard-image API nothing here calls.
# `wayland-data-control` is kept: without it the Linux backend is X11 only, so
# a Wayland session with no XWayland — a plausible AppImage host, and the very
# platform this was reported on — would be right back to having no clipboard.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
# In-app auto-update: fetches the signed `latest.json` manifest from
# GitHub Releases, verifies the bundle against the minisign `pubkey` in
# tauri.conf.json, downloads, and relaunches via tauri-plugin-process.
tauri-plugin-updater = { version = "2", optional = true }
# eMule's SecIdent, RSA-384 with PKCS#1 v1.5 over SHA-1. `hazmat` is what
# still makes keys under 1024 bits, and `credits.rs` decodes peers' keys with
# a size floor of its own; `sha1` and `getrandom` here are the digest and
# system RNG of the generation `rsa` 0.10 is built on.
rsa = { version = "0.10", features = ["pkcs1v15", "hazmat"] }
sha1-rsa = { package = "sha1", version = "0.11", default-features = false, features = ["oid"] }
getrandom-sys = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
num-bigint-dig = "0.8"
opener = { version = "0.9", optional = true }
crc32fast = "1"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
snow = "0.9"
chacha20poly1305 = "0.10"
quinn = "0.11"
# The version quinn already pulls in, named directly for `InvalidCid`, which
# quinn does not re-export and a custom connection-id generator must return.
quinn-proto = "0.11"
rcgen = "0.14"
rustls = { version = "0.23", features = ["ring"] }
# Used to robustly parse a peer's QUIC/TLS certificate and extract its
# real SubjectPublicKeyInfo (see `network::ember::quic`'s
# `EmberCertVerifier`) instead of pattern-matching bytes in the DER —
# a hand-rolled byte search is spoofable (an attacker can plant a
# decoy match earlier in a self-crafted certificate), whereas a real
# ASN.1/DER parser walks the actual certificate structure and cannot
# be fooled that way.
x509-cert = { version = "0.3", default-features = false }
# Stored and Deflate only: backups are written Deflated, and the only zips read
# are those backups and ipfilter.zip. Every other method fails as unsupported
# instead of reaching the zstd (C), xz/lzma, PPMd, bzip2 or deflate64 decoders
# with a third-party archive. `zlib-rs` is the backend flate2 already uses.
# `time` stamps backup entries with the export time.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
fs2 = "0.4"
maxminddb = "0.32"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
parking_lot = "0.12"
# Direct `notify` rather than `notify-debouncer-mini`: the mini crate drops
# EventKind, and Linux inotify OPEN/ATTRIB from our own directory walk would
# otherwise look like a user change and rescan in a loop.
notify = "8"
# The AntiLeech filter's user-editable patterns, related search's title rules
# and the log's privacy filter. `unicode` is named rather than inherited: the
# patterns use `(?i)`, `\d`, `\s` and `\b`, which fail to compile without
# its tables, and the desktop build only had them because Tauri's own
# dependencies turn them on. emberd has no Tauri.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
lofty = "0.25"
# Friend-chat E2E encryption (`network::ember::crypto`): converts our
# existing Ed25519 identity keys to X25519 for ECDH, then HKDF-stretches
# the shared secret into an AEAD key. Pinned to the same `curve25519-dalek`
# major version `ed25519-dalek` already pulls in (v4) so we don't link two
# copies of the curve arithmetic.
curve25519-dalek = "4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# 0.12 (not the newer 0.13) to stay on the `digest` 0.10 family that our
# `sha2` version already uses — 0.13 upgrades to `digest` 0.11 and would
# pull in a second, incompatible hashing stack.
hkdf = "0.12"
argon2 = "0.5"
# Library deletes go to the Recycle Bin / Trash, so a delete is recoverable and
# a compromised webview cannot wipe shared folders for good.
trash = "5"

[dev-dependencies]
# Reference edit distance the spam filter's bounded Levenshtein is tested
# against.
strsim = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The copy `tauri-plugin-dialog` already links, for the one dialog a launch
# that ends inside `setup` shows: a database that cannot be opened. Not on
# Linux, where its GTK dialog would wait on the main context the event loop
# already holds.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
# emberd builds the keyring's libdbus in rather than linking it: a server or a
# slim container often has none, and emberd reaches the keyring only to open
# what the desktop app sealed, so it needs nothing beyond glibc to start.
libdbus-sys = { version = "0.2", features = ["vendored"], optional = true }
# D-Bus for the sleep inhibitor (`src/power.rs`) and the tray-host probe
# (`src/tray.rs`). The same crate and major version `notify-rust` already
# links for desktop notifications, so this adds no second D-Bus stack.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    # `GetBestInterface` and `GetIfEntry2`, to tell whether internet traffic
    # leaves through a VPN's adapter (see `src/vpn.rs`); the other two carry
    # the types `MIB_IF_ROW2` and `GetIfEntry2` are declared with.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # `RasEnumConnectionsW`, so a PPP route is judged by its connection's
    # device type: a VPN's, or PPPoE broadband's (see `src/vpn.rs`).
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # `IOCTL_STORAGE_QUERY_PROPERTY` and the seek-penalty descriptor, used by
    # `sharing::disk` to tell a solid-state library from a spinning one before
    # deciding whether to hash several files at once.
    "Win32_System_Ioctl",
    # `SetThreadExecutionState`, the sleep inhibitor held during transfers
    # (see `src/power.rs`).
    "Win32_System_Power",
    # `RegGetValueW`, to tell a missing launch-at-sign-in `Run` value from one
    # the user disabled in Task Manager (see `src/login_launch.rs`).
    "Win32_System_Registry",
    # `GetTickCount` and `GetLastInputInfo`, for how long the user has been
    # idle before friends see them as Away (see `src/idle.rs`).
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # `ShellExecuteExW` and `CoInitializeEx`, to ask for elevation from
    # Ember's own window so the permission prompt opens in front of it (see
    # `security::firewall::run_elevated`).
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Ed25519 verification runs ~100x slower unoptimized, and startup re-verifies
# every record restored from `store_ember.dat`. At a few thousand records that
# pushes the network event loop past the 15s `SharedFilesChangedAck` budget in
# `reconcile_shared_files`, so a dev run logs a reconciliation failure that a
# release build never sees. Optimizing only these crates leaves our own code at
# `opt-level = 0`.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Line numbers are what a panic's backtrace needs. Full debug info made each
# debug build of this crate several gigabytes, and the check, test and emberd
# builds beside it multiplied that until the build folders ran to hundreds of
# gigabytes. Dependencies carry none. Test builds inherit the first, and are
# given the second themselves.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
# Unwind on panic so tokio task panics surface via JoinHandle instead of
# killing the whole process. A single malformed network packet or corrupt
# file should never take down a long-running P2P client.
panic = "unwind"
# Keep arithmetic overflow a panic in release builds, not a silent wrap.
# Lengths, offsets and part counts are derived from attacker-controlled ed2k,
# KAD and DHT frames and pass through hundreds of numeric casts and ceil
# divisions; a wrapped value there becomes a bad seek or a truncated hash
# comparison that is far harder to diagnose than a panic the unwinding above
# already confines to the offending task.
overflow-checks = true
