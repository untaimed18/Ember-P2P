[package]
name = "ember-macros"
version = "1.8.0"
description = "One command list for the Ember desktop app and emberd"
authors = ["untaimed18"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
# The version `tauri-macros` names arguments with, so a command's JSON keys
# are the same over IPC and over `emberd`'s HTTP interface.
heck = "0.5"
