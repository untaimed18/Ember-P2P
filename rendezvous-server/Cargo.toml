[package]
name = "ember-rendezvous"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
rand = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
# Deliberately NOT panic = "abort". Axum/tokio isolate a panicking
# request handler to its own task (the runtime catches the unwind at
# the task boundary and fails just that task's JoinHandle) — that's
# what stops one malformed request from taking down every other
# in-flight connection and the sweep task. `panic = "abort"` disables
# unwinding process-wide, so any single panicking handler (e.g. an
# unexpected slice-index/arithmetic panic on attacker-controlled
# input) would kill the entire server process instead of just that
# request. The binary-size/perf win from `abort` isn't worth trading
# away per-request fault isolation on an internet-facing service.
